services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # port acmiriq, db-ye yalniz api qosulur
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # port acmiriq, redis-e yalniz api konteyneri qosulur
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/app:/app/app
      - ./data/eval:/app/eval
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build: ./frontend
    environment:
      API_URL: http://api:8000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./frontend:/app
    ports:
      - "8510:8501"
    depends_on:
      - api

  # n8n: Telegram mesajlari, gunluk xatirlatma (Wait) ve heftelik hesabat (Schedule)
  n8n:
    image: docker.n8n.io/n8nio/n8n
    environment:
      GENERIC_TIMEZONE: Asia/Baku
      TZ: Asia/Baku
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/files
    ports:
      - "5679:5678"  # 5678 Mac-de basqa n8n-e lazimdir

volumes:
  pgdata:
  n8n_data:
